<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punchline Party</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#14131b;--panel:#21202b;--muted:#a6a2b7;--lime:#d7ff67;--purple:#b6a0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#faf8ff;font:16px 'Space Grotesk',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff19;padding-bottom:24px}.brand{font-weight:700;font-size:21px}.logo{background:var(--lime);color:var(--bg);padding:7px 11px;border-radius:10px;display:inline-block;transform:rotate(-7deg);margin-right:12px}.tag{font-size:12px;letter-spacing:1px;color:var(--muted)}h1{font-size:clamp(42px,7vw,74px);line-height:1.04;letter-spacing:-3px;margin:24px 0}h1 em{font-style:normal;color:var(--lime)}h2{font-size:29px;letter-spacing:-1px;margin:10px 0 20px}p{color:var(--muted);line-height:1.6}.hero{padding:55px 0 32px;max-width:740px}.eyebrow{color:var(--purple);text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid #ffffff12;border-radius:20px;padding:28px}.card h2{font-size:24px}label{display:block;color:var(--muted);font-size:13px;margin:16px 0 9px}input,textarea{background:#14131b;border:1px solid #ffffff25;color:#fff;padding:15px;border-radius:11px;width:100%;font:inherit}input:focus,textarea:focus{outline:2px solid var(--purple)}button{background:var(--lime);color:#181a10;border:0;border-radius:11px;padding:15px 22px;font:700 15px inherit;cursor:pointer;font-family:inherit;font-weight:700}button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:default}.full{width:100%;margin-top:17px}.secondary{background:#35313f;color:white}.steps{display:flex;gap:28px;margin:30px 0;font-size:13px;color:var(--muted)}.steps b{color:var(--purple);margin-right:7px}.roomtop{display:flex;justify-content:space-between;align-items:center;margin:30px 0}.code{color:var(--lime);letter-spacing:4px;font-size:30px;font-weight:700}.badge{color:var(--purple);background:#b6a0ff15;padding:8px 12px;border-radius:30px;font-size:12px}.play{display:grid;grid-template-columns:1fr 260px;gap:20px}.player{display:flex;justify-content:space-between;gap:8px;padding:14px 0;border-bottom:1px solid #ffffff12}.avatar{color:var(--purple)}.choice{display:block;width:100%;text-align:left;margin:12px 0;background:#302d3d;color:white;padding:22px;border:1px solid #ffffff16}.status{color:var(--lime);padding:16px 0}#error{color:#ffb5b5;min-height:24px;margin-top:16px}footer{color:#777286;font-size:12px;margin-top:40px}.timer{font-variant-numeric:tabular-nums;color:var(--lime)}.result{padding:17px 0;border-bottom:1px solid #ffffff15}.result small{display:block;color:var(--purple);margin-top:8px}.winner{font-size:38px;color:var(--lime)}@media(max-width:650px){.grid,.play{grid-template-columns:1fr}.hero{padding-top:35px}.steps{gap:13px;font-size:11px}.card{padding:22px}.tag{font-size:10px}main{padding:22px 16px}h1{letter-spacing:-2px}}
</style></head><body><main><header><div class="brand"><span class="logo">P!</span>Punchline Party</div><span class="tag" id="connection">2–8 PLAYERS · ZERO DOWNLOADS</span></header><div id="app"></div><div id="error" role="alert"></div><footer>One prompt. Your weirdest ideas. Everyone’s vote.</footer></main><script>
const app=document.querySelector('#app'),err=document.querySelector('#error');let state=null,source=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved;try{saved=JSON.parse(sessionStorage.getItem('punchline'));}catch{}
async function act(action,extra={}){err.textContent='';try{const res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:state?.code,player:state?.me,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error);state=data;sessionStorage.setItem('punchline',JSON.stringify({code:data.code,me:data.me}));render();if(!source)connect();}catch(e){err.textContent=e.message;}}
function connect(){source=new EventSource('/events?room='+state.code+'&player='+state.me);source.onmessage=e=>{state=JSON.parse(e.data);render();};source.onopen=()=>document.querySelector('#connection').textContent='● CONNECTED';source.onerror=()=>{document.querySelector('#connection').textContent='RECONNECTING…';};}
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">Your group chat, but funnier.</div><h1>Big laughs.<br><em>Questionable answers.</em></h1><p>The party game where your friends write the punchlines.<br>Grab a room, drop an answer, and let the votes decide.</p></section><div class="grid"><form class="card" id="create"><h2>Start something funny ↗</h2><p>Be the host. Bring your people.</p><label for="name">Your nickname</label><input id="name" maxlength="20" placeholder="e.g. Teju" required><button class="full">Create a room</button></form><form class="card" id="join"><h2>Already got an invite?</h2><p>Your crew is waiting for you.</p><label for="joinname">Your nickname</label><input id="joinname" maxlength="20" placeholder="Your party name" required><label for="code">Room code</label><input id="code" maxlength="5" placeholder="ABCDE" required style="text-transform:uppercase"><button class="full secondary">Join the party</button></form></div><div class="steps"><span><b>01</b>Write a funny answer</span><span><b>02</b>Vote for a favorite</span><span><b>03</b>Collect the glory</span></div>`;document.querySelector('#create').onsubmit=e=>{e.preventDefault();act('create',{name:document.querySelector('#name').value});};document.querySelector('#join').onsubmit=e=>{e.preventDefault();act('join',{name:document.querySelector('#joinname').value,code:document.querySelector('#code').value});};}
let lastRender='';function render(){const snapshot=JSON.stringify(state);if(snapshot===lastRender)return;lastRender=snapshot;const s=state,host=s.me===s.host;const draft=document.querySelector('#answer')?.value;let body='';if(s.phase==='lobby')body=`<div class="eyebrow">The green room</div><h2>Good company.<br>Bad punchlines encouraged.</h2><p>Share the room code and this page’s address. Everyone joins on their own device.</p><div class="status">${s.players.length}/8 players have arrived</div><p>5 rounds · 60 seconds to answer · 30 seconds to vote.<br>Answers stay anonymous until results. No voting for yourself.<br>Each vote earns 1 point. Ties share the win.</p>${host?`<button id="start" ${s.players.length<2?'disabled':''}>Let’s play →</button>`:'<p>Waiting for the host to start…</p>'}`;
if(s.phase==='answering')body=`<div class="eyebrow">Make it memorable</div><h2>${esc(s.prompt)}</h2>${s.answer?'<div class="status">✓ Answer locked in. Waiting for the others…</div>':`<form id="answerform"><label for="answer">Your punchline</label><textarea id="answer" rows="4" maxlength="180" placeholder="Funny, weird, unexpected. Go for it." required>${esc(draft||'')}</textarea><button class="full">Lock my answer →</button></form>`}<p>${s.players.filter(p=>p.answered).length}/${s.players.length} answers are in.</p>`;
if(s.phase==='voting')body=`<div class="eyebrow">Pick your favorite</div><h2>${esc(s.prompt)}</h2><p>${s.vote?'Vote locked. Let the others decide.':'One vote. Make it count. You cannot vote for yourself.'}</p>${s.choices.map(c=>`<button class="choice" data-choice="${c.id}" ${c.own||s.vote?'disabled':''}>${esc(c.text)}${c.own?' <small>· your answer</small>':''}${s.vote===c.id?' ✓':''}</button>`).join('')}<p>${s.players.filter(p=>p.voted).length}/${s.players.length} votes are in.</p>`;
if(['results','finished'].includes(s.phase)){const max=Math.max(...s.players.map(p=>p.score)),winners=s.players.filter(p=>p.score===max);body=`<div class="eyebrow">${s.phase==='finished'?'That’s a wrap':'The reveal'}</div><h2>${s.phase==='finished'?'Meet your comedy royalty.':'And the laughs go to…'}</h2>${s.phase==='finished'?`<div class="winner">${winners.map(p=>esc(p.name)).join(' & ')} 🏆</div><p>${max} points · ${winners.length>1?'Shared victory!':'Certified crowd favorite.'}</p>`:`<p>${esc(s.prompt)}</p>`}${s.results.map(r=>`<div class="result">${esc(r.text)}<small>${esc(r.name)} · +${r.points} ${r.points===1?'point':'points'}</small></div>`).join('')}${s.results.length<2?'<p>Not enough answers this round. No points awarded.</p>':''}${host?`<button class="full" id="next">${s.phase==='finished'?'Play again ↻':'Next round →'}</button>`:'<p>Waiting for the host…</p>'}`;}
app.innerHTML=`<div class="roomtop"><div><div class="eyebrow">Room code</div><div class="code">${s.code}</div></div><div class="badge">${s.phase==='lobby'?'LOBBY':`ROUND ${s.round} / ${s.total}`} <span class="timer" id="timer"></span></div></div><div class="play"><section class="card">${body}</section><aside class="card"><div class="eyebrow">${s.phase==='lobby'?'The crew':'Leaderboard'}</div>${[...s.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="player"><span><span class="avatar">●</span> ${esc(p.name)} ${p.id===s.me?'(you)':''}<small>${p.id===s.host?' ♛':''}</small></span><b>${s.phase==='lobby'?'✓':p.score}</b></div>`).join('')}</aside></div>`;
document.querySelector('#start')?.addEventListener('click',()=>act('start'));document.querySelector('#next')?.addEventListener('click',()=>act(s.phase==='finished'?'restart':'next'));document.querySelector('#answerform')?.addEventListener('submit',e=>{e.preventDefault();act('answer',{text:document.querySelector('#answer').value});});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>act('vote',{choice:b.dataset.choice}));tick();}
function tick(){const t=document.querySelector('#timer');if(t&&state?.deadline)t.textContent=' · '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s';}setInterval(tick,250);if(saved?.code&&saved?.me){state=saved;connect();app.innerHTML='<p>Rejoining your room…</p><button onclick="sessionStorage.removeItem(\'punchline\');location.reload()">Start fresh</button>';}else home();
</script></body></html>
